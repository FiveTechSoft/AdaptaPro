name: ERP mail CI - offline dry-run skeleton
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adaptapro-erp-mail-worker
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CI_SEND_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Offline contract validation (no mailbox or gateway access)
        run: python3 scripts/ci_erp_preflight.py
