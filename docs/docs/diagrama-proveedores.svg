<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">AdaptaPro: una base compartida, adaptaciones locales</title><desc id="desc">Esquema del núcleo central, forks de proveedores en Colombia, Venezuela y un país nuevo, packs documentados y retorno por pull request, CI y revisión humana. Se distingue lo existente en la demo de lo propuesto.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1830"/><stop offset="1" stop-color="#142d43"/></linearGradient><linearGradient id="core" x2="1" y2="1"><stop stop-color="#123858"/><stop offset="1" stop-color="#194b63"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#64ded2"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f2f7fc}.eyebrow{font-size:20px;letter-spacing:4px;font-weight:bold;fill:#7de0d6}.title{font-size:54px;font-weight:700}.sub{font-size:24px;fill:#bbcedd}.label{font-size:27px;font-weight:bold}.copy{font-size:20px;fill:#c9dce8}.tiny{font-size:17px;fill:#a9c2d1}.tag{font-size:16px;font-weight:bold;letter-spacing:1px;fill:#062c36}.flow{fill:none;stroke:#64ded2;stroke-width:4;marker-end:url(#arrow)}.outline{stroke:#52718c;stroke-width:2}</style></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><path d="M0 155H1600M0 901H1600" stroke="#32536b" stroke-width="2"/>
<text fill="#f2f7fc" x="88" y="63" class="eyebrow">FIVETECHSOFT / MODELO DE COLABORACIÓN</text><text fill="#f2f7fc" x="88" y="126" class="title" font-size="42">AdaptaPro · red de proveedores</text>
<rect x="88" y="216" width="540" height="506" rx="26" fill="url(#core)" class="outline"/><rect x="113" y="240" width="149" height="32" rx="16" fill="#77dbcb"/><text fill="#f2f7fc" x="131" y="262" class="tag">DEMO ACTUAL</text><text fill="#f2f7fc" x="126" y="326" class="label">AdaptaPro · núcleo</text><text fill="#f2f7fc" x="126" y="374" class="copy">Interfaz y flujos compartidos</text><line x1="126" y1="405" x2="584" y2="405" stroke="#52718c"/><text fill="#f2f7fc" x="126" y="450" class="copy">• Agentes ALPHA / BETA / GAMMA</text><text fill="#f2f7fc" x="126" y="495" class="copy">• Aprobaciones + auditoría local</text><text fill="#f2f7fc" x="126" y="540" class="copy">• Modo Supervisado / Autónomo</text><text fill="#f2f7fc" x="126" y="585" class="copy">• Selector jurídico CO / VE</text><text fill="#f2f7fc" x="126" y="650" class="tiny">SQLite en navegador · IndexedDB</text><text fill="#f2f7fc" x="126" y="681" class="tiny">Sin backend multiusuario ni packs cargables</text>
<path d="M638 375H731" class="flow"/><text fill="#f2f7fc" x="645" y="349" class="tiny">fork + agente</text>
<rect x="744" y="217" width="767" height="338" rx="26" fill="#1a3048" class="outline"/><rect x="770" y="242" width="257" height="32" rx="16" fill="#e7b36d"/><text fill="#f2f7fc" x="791" y="264" class="tag">FLUJO PROPUESTO</text><text fill="#f2f7fc" x="775" y="323" class="label">Proveedores · ramas de trabajo</text>
<rect x="775" y="360" width="218" height="133" rx="17" fill="#243e58"/><rect x="1017" y="360" width="218" height="133" rx="17" fill="#243e58"/><rect x="1259" y="360" width="218" height="133" rx="17" fill="#243e58"/>
<text fill="#f2f7fc" x="797" y="401" class="label" font-size="22">CO · Colombia</text><text fill="#f2f7fc" x="797" y="438" class="tiny">Ejemplo actual</text><text fill="#f2f7fc" x="797" y="470" class="tiny">Índice de pack</text><text fill="#f2f7fc" x="1039" y="401" class="label">VE · Venezuela</text><text fill="#f2f7fc" x="1039" y="438" class="tiny">Selector actual</text><text fill="#f2f7fc" x="1039" y="470" class="tiny">Pack pendiente</text><text fill="#f2f7fc" x="1281" y="401" class="label">XX · Otro país</text><text fill="#f2f7fc" x="1281" y="438" class="tiny">Nuevo fork</text><text fill="#f2f7fc" x="1281" y="470" class="tiny">Pack pendiente</text>
<text fill="#f2f7fc" x="777" y="531" class="tiny">Un pack registra alcance, fuentes, vigencia y responsable.</text>
<path d="M1116 560V605" class="flow"/><rect x="744" y="619" width="767" height="103" rx="20" fill="#1a4e58" stroke="#6fd4c9" stroke-width="2"/><text fill="#f2f7fc" x="777" y="663" class="label">PR → CI → revisión humana → integración</text><text fill="#f2f7fc" x="777" y="697" class="tiny">Las mejoras reutilizables vuelven al núcleo; lo específico puede quedar en el fork.</text>
<path d="M744 676H638" class="flow"/><rect x="88" y="762" width="1423" height="102" rx="18" fill="#162b3f" stroke="#55738a"/><text fill="#f2f7fc" x="117" y="800" class="copy">AGENTS.md + guía de contribución + validador de manifiestos</text><text fill="#f2f7fc" x="117" y="836" class="tiny">El agente propone y prueba. El proveedor valida su país. FiveTechSoft revisa cambios del núcleo.</text>
<text fill="#f2f7fc" x="89" y="947" class="tiny">ARQUITECTURA OBJETIVO · Los packs aún no ejecutan reglas en la demo. No equivale a certificación normativa.</text><text fill="#f2f7fc" x="1502" y="947" text-anchor="end" class="eyebrow" font-size="15">ADAPTAPRO</text>
</svg>
